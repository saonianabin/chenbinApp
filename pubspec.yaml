name: chenbin_app
description: WMS 仓储管理系统

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  cupertino_icons: ^1.0.6
  permission_handler: ^11.0.1
  mobile_scanner: ^5.1.1
  dio: ^5.9.0
  tdesign_flutter: ^0.2.0
  shared_preferences: ^2.2.3
  flutter_app_update: ^3.2.2
  device_info_plus: ^9.1.2
  package_info_plus: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: NotoSansSC
      fonts:
        - asset: fonts//NotoSansSC-Regular.ttf
          weight: 400
        - asset: fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: fonts/NotoSansSC-Medium.ttf
          weight: 700